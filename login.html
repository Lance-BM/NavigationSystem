<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - Loyola Walkers</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="card">
            <div class="card-header">
                <h1>Log In</h1>
                <p>Welcome back! Enter your details to continue.</p>
            </div>
            <div class="card-body">
                {% with messages = get_flashed_messages() %}
                    {% for msg in messages %}<p class="flash" role="alert">{{ msg }}</p>{% endfor %}
                {% endwith %}

                <form class="auth-form" method="POST" action="{{ url_for('login') }}">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" autocomplete="username" required autofocus>

                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" autocomplete="current-password" required>

                    <button class="btn" type="submit">Log In</button>
                </form>

                <p class="switch">Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p>
                <a class="back-link" href="{{ url_for('landing') }}">&larr; Back</a>
            </div>
        </section>
    </main>
</body>
</html>
